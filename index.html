<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to my resume! — CV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0b;
    --panel: rgba(255, 255, 255, 0.04);
    --text: #f5f5f7;
    --muted: #8a8a92;
    --border: rgba(255, 255, 255, 0.12);
    --border-strong: rgba(255, 255, 255, 0.28);
    --hover: rgba(255, 255, 255, 0.08);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ===== 3D dot background canvas ===== */
  #dots {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
    pointer-events: none;
  }

  /* Subtle radial vignette on top of the canvas */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 40%, transparent 0%, rgba(10,10,11,0.55) 70%, rgba(10,10,11,0.95) 100%);
  }

  /* ===== Content ===== */
  .wrap {
    position: relative;
    z-index: 2;
    max-width: 520px;
    margin: 0 auto;
    padding: 96px 24px 64px;
    text-align: center;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #111114;
    border: 1px solid var(--border-strong);
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.02em;
    box-shadow:
      0 0 0 8px rgba(255,255,255,0.02),
      0 20px 40px rgba(0,0,0,0.6);
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 40px;
  }

  /* ===== Buttons ===== */
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
  }

  .row {
    display: flex;
    gap: 12px;
  }
  .row .btn { flex: 1; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform 0.15s ease, background 0.15s ease,
                border-color 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
  }

  .btn:hover {
    background: var(--hover);
    border-color: var(--border-strong);
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .btn:active { transform: translateY(0); }

  .btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* Primary button (bio) — white on black inverted */
  .btn-primary {
    background: #f5f5f7;
    color: #0a0a0b;
    border-color: #f5f5f7;
  }
  .btn-primary:hover {
    background: #fff;
    border-color: #fff;
  }

  /* GitHub — dark with outline */
  .btn-github {
    background: #16161a;
    color: #f5f5f7;
    border-color: rgba(255,255,255,0.18);
  }
  .btn-github:hover {
    background: #1d1d22;
    border-color: rgba(255,255,255,0.35);
  }

  /* Footer */
  .footer {
    margin-top: 48px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .footer a {
    color: var(--muted);
    text-decoration: none;
    margin: 0 10px;
    transition: color 0.15s ease;
  }
  .footer a:hover { color: #fff; }
</style>
</head>
<body>

  </div>

  <!-- ============================================= -->
  <!-- 3D animated dot field                          -->
  <!-- ============================================= -->
  <script>
  (function () {
    const canvas = document.getElementById('dots');
    const ctx = canvas.getContext('2d');

    let W, H, DPR;
    let dots = [];
    let mouse = { x: -9999, y: -9999 };
    let t = 0;

    // Wave of dots that "snakes" toward the cursor and drifts in 3D
    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      buildDots();
    }

    function buildDots() {
      dots = [];
      const spacing = 34; // distance between dots
      const cols = Math.ceil(W / spacing) + 2;
      const rows = Math.ceil(H / spacing) + 2;
      const offsetX = (W - (cols - 1) * spacing) / 2;
      const offsetY = (H - (rows - 1) * spacing) / 2;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          dots.push({
            bx: offsetX + c * spacing,
            by: offsetY + r * spacing,
            x: 0, y: 0,
            // per-dot phase so the wave looks organic
            phase: (c * 0.35 + r * 0.55),
          });
        }
      }
    }

    // Pseudo-3D: each dot is displaced by a sine wave that travels
    // diagonally, and slightly attracted to the cursor.
    function frame() {
      t += 0.012;
      ctx.clearRect(0, 0, W, H);

      // Dark gradient base (subtle)
      const bg = ctx.createRadialGradient(W / 2, H * 0.35, 0,
                                          W / 2, H * 0.35, Math.max(W, H) * 0.8);
      bg.addColorStop(0, '#141418');
      bg.addColorStop(1, '#08080a');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      for (const d of dots) {
        // traveling wave
        const wave = Math.sin(t * 2 + d.phase);
        const wave2 = Math.cos(t * 1.4 + d.phase * 0.7);

        // cursor influence
        const dx = d.bx - mouse.x;
        const dy = d.by - mouse.y;
        const dist = Math.hypot(dx, dy);
        const influence = Math.max(0, 1 - dist / 220); // 0..1

        // displacement: wave + cursor push
        const push = influence * 14;
        const angle = Math.atan2(dy, dx);

        d.x = d.bx + wave * 4 + Math.cos(angle) * push;
        d.y = d.by + wave2 * 4 + Math.sin(angle) * push;

        // radius grows slightly with wave + cursor
        const r = 1.1 + Math.abs(wave) * 0.6 + influence * 1.6;

        // brightness
        const alpha = 0.18 + Math.abs(wave) * 0.35 + influence * 0.5;

        ctx.beginPath();
        ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(245,245,247,${alpha})`;
        ctx.fill();
      }

      requestAnimationFrame(frame);
    }

    // Cursor tracking
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouse.x = -9999; mouse.y = -9999;
    });
    // Touch support (mobile)
    window.addEventListener('touchmove', (e) => {
      const t0 = e.touches[0];
      if (t0) { mouse.x = t0.clientX; mouse.y = t0.clientY; }
    }, { passive: true });
    window.addEventListener('touchend', () => {
      mouse.x = -9999; mouse.y = -9999;
    });

    window.addEventListener('resize', resize);
    resize();
    frame();
  })();
  </script>

</body>
