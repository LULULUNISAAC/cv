<title>Welcome to my resume! — CV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0b;
    --panel: rgba(255, 255, 255, 0.04);
    --text: #f5f5f7;
    --muted: #8a8a92;
    --border: rgba(255, 255, 255, 0.12);
    --border-strong: rgba(255, 255, 255, 0.28);
    --hover: rgba(255, 255, 255, 0.08);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  #dots {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
    pointer-events: none;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 40%, transparent 0%, rgba(10,10,11,0.55) 70%, rgba(10,10,11,0.95) 100%);
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 520px;
    margin: 0 auto;
    padding: 96px 24px 64px;
    text-align: center;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #111114;
    border: 1px solid var(--border-strong);
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.02em;
    box-shadow:
      0 0 0 8px rgba(255,255,255,0.02),
      0 20px 40px rgba(0,0,0,0.6);
    animation: float 6s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 40px;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
  }

  .row {
    display: flex;
    gap: 12px;
  }
  .row .btn { flex: 1; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform 0.15s ease, background 0.15s ease,
                border-color 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
  }

  .btn:hover {
    background: var(--hover);
    border-color: var(--border-strong);
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .btn:active { transform: translateY(0); }

  .btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .btn-primary {
    background: #f5f5f7;
    color: #0a0a0b;
    border-color: #f5f5f7;
  }
  .btn-primary:hover {
    background: #fff;
    border-color: #fff;
  }

  .btn-github {
    background: #16161a;
    color: #f5f5f7;
    border-color: rgba(255,255,255,0.18);
  }
  .btn-github:hover {
    background: #1d1d22;
    border-color: rgba(255,255,255,0.35);
  }

  .footer {
    margin-top: 48px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .footer a {
    color: var(--muted);
    text-decoration: none;
    margin: 0 10px;
    transition: color 0.15s ease;
  }
  .footer a:hover { color: #fff; }
</style>

  <!-- ============================================= -->
  <!-- 3D auto-animating dot field (no cursor)        -->
  <!-- ============================================= -->
  <script>
  (function () {
    const canvas = document.getElementById('dots');
    const ctx = canvas.getContext('2d');

    let W, H, DPR;
    let dots = [];
    let t = 0;

    const SPACING      = 34;    // distance between dots
    const WAVE_AMP     = 6;     // how far dots travel
    const WAVE_SPEED   = 1.2;   // speed of the traveling wave
    const ROTATE_SPEED = 0.15;  // 3D rotation speed
    const PERSPECTIVE  = 800;   // smaller = stronger 3D depth

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      buildDots();
    }

    function buildDots() {
      dots = [];
      const cols = Math.ceil(W / SPACING) + 4;
      const rows = Math.ceil(H / SPACING) + 4;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = (c - cols / 2) * SPACING;
          const y = (r - rows / 2) * SPACING;
          const z = Math.sin(c * 0.3) * 30 + Math.cos(r * 0.25) * 30;
          dots.push({ x, y, z, phase: c * 0.25 + r * 0.4 });
        }
      }
    }

    function project(x, y, z, cx, cy, cosA, sinA) {
      const rx = x * cosA - z * sinA;
      const rz = x * sinA + z * cosA;
      const ry = y;
      const scale = PERSPECTIVE / (PERSPECTIVE + rz);
      return {
        sx: cx + rx * scale,
        sy: cy + ry * scale,
        scale,
      };
    }

    function frame() {
      t += 0.016;
      const angle = t * ROTATE_SPEED;
      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);

      const bg = ctx.createRadialGradient(W / 2, H * 0.35, 0,
                                          W / 2, H * 0.35, Math.max(W, H) * 0.8);
      bg.addColorStop(0, '#141418');
      bg.addColorStop(1, '#08080a');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      const cx = W / 2;
      const cy = H / 2;

      for (const d of dots) {
        const wave  = Math.sin(t * WAVE_SPEED + d.phase);
        const wave2 = Math.cos(t * WAVE_SPEED * 0.7 + d.phase * 0.5);

        const wy = d.y + wave * WAVE_AMP;
        const wz = d.z + wave2 * WAVE_AMP * 1.5;

        const p = project(d.x, wy, wz, cx, cy, cosA, sinA);

        if (p.sx < -50 || p.sx > W + 50 || p.sy < -50 || p.sy > H + 50) continue;

        const depth = 0.4 + p.scale * 0.8;
        const alpha = Math.min(0.9, 0.15 + Math.abs(wave) * 0.35) * depth;
        const r = (0.9 + Math.abs(wave) * 0.6) * p.scale;

        ctx.beginPath();
        ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(245,245,247,${alpha})`;
        ctx.fill();
      }

      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    resize();
    frame();
  })();
  </script>

</body>
