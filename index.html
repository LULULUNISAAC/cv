<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>John Doe — CV</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 640px;
    margin: 60px auto;
    padding: 0 20px;
    color: #161a20;
    line-height: 1.5;
  }
  h1 { margin-bottom: 4px; }
  .sub { color: #5b6270; margin-top: 0; }
  a.btn {
    display: inline-block;
    margin-top: 24px;
    padding: 12px 22px;
    background: #3562e0;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
  }
  a.btn:hover { background: #274bb8; }
  .links { margin-top: 20px; }
  .links a { color: #3562e0; margin-right: 16px; text-decoration: none; }
</style>
</head>
<body>
  <h1>John Doe</h1>
  <p class="sub">Software Engineer · john@example.com</p>

  <p>Welcome. You can view or download my CV below.</p>

  <a class="btn" href="cv.pdf" target="_blank">📄 View my CV (PDF)</a>
  <a class="btn" href="cv.pdf" download style="background:#161a20;">⬇️ Download</a>

  <div class="links">
    <a href="https://linkedin.com/in/yourname">LinkedIn</a>
    <a href="https://github.com/yourname">GitHub</a>
    <a href="mailto:john@example.com">Email</a>
  </div>
</body>
</html>
