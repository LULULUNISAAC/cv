<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My CV</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 560px;
    margin: 80px auto;
    padding: 0 20px;
    color: #161a20;
    background: #f5f6f8;
    line-height: 1.5;
  }
  h1 { margin-bottom: 4px; }
  .sub { color: #5b6270; margin-top: 0; }

    padding: 12px 22px;
    background: #3562e0;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
  }
  a.btn.alt { background: #161a20; }

<body>
  <h1>Your Name</h1>
  <p class="sub">Your Title · your@email.com</p>

  <p>You can view or download my CV below.</p>

  <a class="btn" href="cv.pdf" target="_blank">📄 View CV</a>
  <a class="btn alt" href="cv.pdf" download>⬇️ Download</a>

</html>
